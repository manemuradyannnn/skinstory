<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <title>Sample illustration</title>
  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="mark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="#e2c2aa"/>
  <g filter="url(#soft)">
    <ellipse cx="320" cy="380" rx="240" ry="200" fill="#f0d6c4"/>
    <ellipse cx="520" cy="680" rx="220" ry="180" fill="#d0aa90"/>
  </g>
  <g filter="url(#mark)" opacity="0.78">
    <ellipse cx="450" cy="470" rx="48" ry="32" fill="#c67d6c"/>
    <ellipse cx="454" cy="472" rx="23.0" ry="14.7" fill="#9a584e"/>
    <ellipse cx="466" cy="482" rx="26.4" ry="23.0" fill="#9a584e" opacity="0.55"/>
  </g>
  <rect width="800" height="1000" filter="url(#grain)"/>
  <rect x="18" y="18" width="764" height="964" fill="none" stroke="#5c534a" stroke-opacity="0.28"/>
  <text x="36" y="948" fill="#4e4942" font-family="Georgia, serif" font-size="28">Sample illustration</text>
</svg>
